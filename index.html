<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smoky Paper</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#000;--fg:#fff;--mut:#8a8a8e;--grn:#22c55e;--red:#ef4444;--org:#f59e0b;--line:#1c1c1e}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif}
.wrap{padding:16px 20px 96px;max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.av{width:38px;height:38px;border-radius:50%;background:#2c2c2e;display:grid;place-items:center;font-weight:700}
.name{font-weight:700;font-size:19px}.name small{color:var(--mut);font-weight:500}
.bal{display:flex;align-items:center;gap:14px}
.bal h1{font-size:64px;font-weight:800;letter-spacing:-2px;margin:0;line-height:1.05}
.pill{background:var(--org);color:#000;font-weight:800;font-size:15px;padding:5px 12px;border-radius:999px;letter-spacing:.5px}
.today{margin-top:10px;font-size:18px;font-weight:600}
.sub{margin-top:10px;font-size:16px;line-height:1.45}.sub b{font-weight:700}
.mut{color:var(--mut)}.g{color:var(--grn)}.r{color:var(--red)}
#chart{width:100%;height:260px;margin-top:18px;display:block}
.empty{fill:var(--mut);font-size:15px}
.ranges{display:flex;justify-content:space-between;margin:18px 0 22px}
.ranges button{background:none;border:0;color:var(--mut);font-weight:700;font-size:15px;padding:10px 12px;border-radius:999px}
.ranges button.on{background:var(--grn);color:#000}
h2{font-size:24px;font-weight:800;margin:0 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.row .s{font-weight:700;font-size:17px}.row .m{color:var(--mut);font-size:13px;margin-top:3px}
.row .p{text-align:right;font-weight:700}.row .p div:last-child{font-size:13px;font-weight:500}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px;background:#1f3b2a;color:var(--grn)}
.foot{color:var(--mut);font-size:12px;margin-top:18px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;background:#0b0b0c;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
nav span{color:var(--mut);font-size:12px;font-weight:600}nav span.on{color:#fff}
</style></head><body>
<div class="wrap">
  <div class="top"><div class="av">S</div><div class="name">Smoky Paper <small>›</small></div></div>
  <div class="bal"><h1 id="bal">—</h1><span class="pill">PAPER</span></div>
  <div class="today" id="today"></div>
  <div class="sub" id="sub"></div>
  <svg id="chart" viewBox="0 0 400 260" preserveAspectRatio="none"></svg>
  <div class="ranges" id="ranges"></div>
  <h2 id="ph">Paper positions</h2>
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<nav><span class="on">Home</span><span>Positions</span><span>Activity</span></nav>
<script src="app.js"></script>
</body></html>
